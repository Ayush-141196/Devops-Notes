version: '3.8'

services:
  # 1. MQTT Broker (EMQX)
  emqx:
    image: emqx/emqx:5.3.0
    container_name: emqx_broker
    ports:
      - "1883:1883"      # MQTT Port
      - "18083:18083"    # EMQX Dashboard UI
    networks:
      - iot_stack

  # 2. Time-Series / Analytics DB (ClickHouse)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_db
    ports:
      - "8123:8123"      # HTTP Interface / Grafana
      - "9000:9000"      # Native Protocol
    environment:
      CLICKHOUSE_DB: iot_telemetry
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: password123
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - iot_stack

  # 3. Metrics Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_monitor
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - iot_stack

  # 4. Visualization (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    networks:
      - iot_stack

networks:
  iot_stack:
    driver: bridge
